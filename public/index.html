<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Income Radar</title>
<style>
  :root {
    --bg: #0d1117; --panel: #151b23; --panel2: #1b2430;
    --border: #2a3441; --border2: #3a4756;
    --text: #dbe4ee; --muted: #7d8c9e; --dim: #56657a;
    --green: #4ade80; --amber: #fbbf24; --red: #f87171; --blue: #7aa2f7;
    --mono: Consolas, "Cascadia Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; min-height: 100vh; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  header { display: flex; align-items: baseline; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  h1 { font-size: 19px; font-weight: 650; letter-spacing: .2px; }
  h1 span { color: var(--muted); font-weight: 400; }
  .meta { color: var(--muted); font-size: 12.5px; margin-left: auto; display: flex; gap: 12px; align-items: center; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border2); border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
  button:hover { border-color: var(--blue); }
  button:disabled { opacity: .5; cursor: wait; }

  nav { display: flex; gap: 6px; margin: 16px 0 14px; }
  nav button { padding: 6px 16px; border-radius: 7px; font-size: 13.5px; }
  nav button.on { border-color: var(--blue); color: var(--blue); background: var(--panel); }
  nav .cnt { color: var(--dim); margin-left: 6px; font-family: var(--mono); font-size: 12px; }
  nav button.on .cnt { color: var(--blue); opacity: .75; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .filters input, .filters select { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 12.5px; }
  .filters input[type=search] { width: 220px; }
  .filters label { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }

  .row { display: grid; grid-template-columns: 92px 1fr 150px 110px 140px; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  .row:hover { border-color: var(--border2); }
  .row.new { border-left: 3px solid var(--blue); }
  .amt { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--green); }
  .amt.pln { color: var(--amber); font-size: 13.5px; }
  .amt small { display: block; font-size: 10.5px; color: var(--dim); font-weight: 400; }
  .ttl a { color: var(--text); text-decoration: none; font-weight: 550; }
  .ttl a:hover { color: var(--blue); text-decoration: underline; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border2); border-radius: 4px; padding: 0 6px; font-size: 11px; color: var(--muted); }
  .src-opire { color: #b48ead; } .src-algora { color: #88c0d0; } .src-useme { color: #a3be8c; }
  .src-github { color: #d8a657; } .src-freelancer { color: #e5c07b; } .src-devpost { color: #c678dd; }
  .comp { font-size: 12px; color: var(--muted); }
  .comp b { font-family: var(--mono); color: var(--text); }
  .verdict { font-size: 11.5px; font-weight: 650; border: 1px solid; border-radius: 5px; padding: 2px 8px; text-align: center; width: fit-content; }
  .v-hot { color: var(--green); border-color: var(--green); }
  .v-ok { color: var(--amber); border-color: var(--amber); }
  .v-crowd { color: var(--red); border-color: var(--red); }
  .v-unknown { color: var(--dim); border-color: var(--border2); }
  select.status { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 6px; font-size: 12px; width: 100%; }

  .empty { color: var(--muted); padding: 30px 0; text-align: center; }

  .acc { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 14px; align-items: flex-start; }
  .acc input[type=checkbox] { width: 17px; height: 17px; margin-top: 2px; accent-color: var(--green); }
  .acc .nm { font-weight: 600; }
  .acc .nm a { color: var(--blue); text-decoration: none; }
  .acc .nm a:hover { text-decoration: underline; }
  .acc p { color: var(--muted); font-size: 12.5px; margin-top: 3px; max-width: 75ch; }
  .acc.done { opacity: .55; }
  .acc.done .nm { text-decoration: line-through; }
  .sect { color: var(--dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px; }
  .draft { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .draft .hd { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .draft .hd a { color: var(--text); font-weight: 600; text-decoration: none; }
  .draft .hd a:hover { color: var(--blue); }
  .draft pre { white-space: pre-wrap; font: 12.5px/1.5 var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-top: 10px; max-height: 360px; overflow: auto; }
  .draft .acts { display: flex; gap: 8px; margin-top: 8px; }

  /* ==== hero stats bar ==== */
  .hero { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; min-width: 110px; flex: 1; text-align: center; }
  .stat-val { font-size: 22px; font-weight: 700; font-family: var(--mono); }
  .stat-val.green { color: var(--green); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }

  /* ==== source breakdown chips ==== */
  .sources { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .schip { font-size: 12px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border2); }
  .schip b { font-family: var(--mono); margin-left: 4px; }

  /* ==== new source colors ==== */
  .src-upwork { color: #6fda44; }
  .src-airdrop { color: #f0b90b; }
  .src-h1bounty { color: #e74c3c; }
  .src-fiverr { color: #1dbf73; }

  /* ==== queue cards ==== */
  .qcard { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; }
  .qcard .qhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
  .qcard .qhead a { color: var(--text); font-weight: 600; text-decoration: none; }
  .qcard .qhead a:hover { color: var(--blue); }
  .qcard .qbody { font-size: 13px; color: var(--muted); white-space: pre-wrap; max-height: 120px; overflow: hidden; font-family: var(--mono); line-height: 1.55; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .qcard .qactions { display: flex; gap: 8px; margin-top: 10px; }
  .qcard .qactions button { padding: 6px 14px; border-radius: 6px; font-size: 12.5px; }
  .btn-approve { background: rgba(74,222,128,.15); border-color: var(--green); color: var(--green); }
  .btn-skip { background: rgba(248,113,113,.1); border-color: var(--red); color: var(--red); }
  .qbulk { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; }

  /* ==== streams grid ==== */
  .streams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .stream-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .stream-icon { font-size: 24px; }
  .stream-name { font-weight: 600; margin: 6px 0 4px; }
  .stream-range { font-family: var(--mono); color: var(--green); font-size: 13px; }
  .stream-status { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-top: 6px; text-transform: uppercase; letter-spacing: .4px; }
  .stream-status.active { background: rgba(74,222,128,.15); color: var(--green); }
  .stream-status.setup { background: rgba(251,191,36,.15); color: var(--amber); }
  .stream-status.planned { background: rgba(125,140,158,.1); color: var(--dim); }
  .stream-auto { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ==== quick-action button in row ==== */
  .qact { background: transparent; border: 1px solid var(--border2); border-radius: 4px; padding: 1px 7px; font-size: 12px; cursor: pointer; color: var(--muted); line-height: 1.4; }
  .qact:hover { border-color: var(--blue); color: var(--blue); }

  /* ==== auto-refresh pulse ==== */
  .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 5px; vertical-align: middle; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  #countdown { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  /* ==== modal (draft preview) ==== */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--panel); border: 1px solid var(--border2); border-radius: 10px; padding: 18px 20px; max-width: 740px; width: 100%; max-height: 84vh; overflow: auto; }
  .modal h3 { font-size: 16px; margin-bottom: 8px; }
  .modal textarea { width: 100%; min-height: 280px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font: 12.5px/1.55 var(--mono); resize: vertical; }
  .modal .acts { display: flex; gap: 8px; margin-top: 12px; }

  /* ==== toast ==== */
  #toast { position: fixed; bottom: 22px; right: 22px; background: var(--panel); border: 1px solid var(--green); color: var(--green); padding: 10px 16px; border-radius: 8px; z-index: 60; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.5); transition: opacity .4s; }

  @media (max-width: 800px) { .row { grid-template-columns: 80px 1fr; } .row > .comp, .row > .verdict, .row > .stwrap { grid-column: 2; } }

  /* ==== NEW: monetization modules ==== */
  /* earnings modal — scoped under .modal-overlay so the existing .modal-bg .modal styles (draft preview) stay intact */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay .modal { background: var(--panel2); border: 1px solid var(--border); border-radius: 14px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }
  .modal-overlay .modal h2 { margin: 0 0 16px; font-size: 18px; }
  .modal-overlay .modal-close { position: absolute; right: 16px; top: 16px; cursor: pointer; font-size: 22px; color: var(--muted); user-select: none; line-height: 1; }
  .modal-overlay .modal-close:hover { color: var(--text); }
  .bar-chart { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-label { width: 110px; font-size: 12px; text-align: right; color: var(--muted); }
  .bar-fill { height: 18px; border-radius: 4px; background: var(--green); min-width: 2px; transition: width .3s; }
  .bar-val { font-size: 12px; font-family: var(--mono); color: var(--text); }
  .ern-trio { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 14px; }
  .ern-trio .ern-cell { flex: 1; min-width: 100px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; text-align: center; }
  .ern-cell .v { font-family: var(--mono); font-size: 18px; color: var(--green); font-weight: 700; }
  .ern-cell .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; margin-top: 2px; }
  .ledger-list { font-size: 12.5px; }
  .ledger-row { display: grid; grid-template-columns: 64px 1fr 90px 90px; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--border); align-items: baseline; }
  .ledger-row .lr-ts { color: var(--dim); font-family: var(--mono); font-size: 11px; }
  .ledger-row .lr-amt { font-family: var(--mono); color: var(--green); text-align: right; font-weight: 600; }
  .ledger-row .lr-src { font-size: 11px; color: var(--muted); }

  /* clickable stat with trend */
  .stat.clickable { cursor: pointer; transition: border-color .15s; }
  .stat.clickable:hover { border-color: var(--green); }
  .trend { font-size: 11px; margin-left: 4px; vertical-align: middle; }
  .trend.up { color: var(--green); }
  .trend.down { color: var(--red); }
  .stat-sub { font-size: 10.5px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }

  /* lead / post cards */
  .lead-card, .post-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  .lead-card:hover, .post-card:hover { border-color: var(--border2); }
  .lead-head, .post-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lead-head .nm { font-weight: 600; }
  .lead-head .em { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .lead-pitch { color: var(--muted); font-size: 12.5px; margin-top: 6px; white-space: pre-wrap; }
  .post-body { color: var(--text); font-size: 13px; margin-top: 8px; white-space: pre-wrap; line-height: 1.55; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .post-body.collapsed { max-height: 60px; overflow: hidden; position: relative; }
  .post-body.collapsed::after { content: ''; position: absolute; inset: auto 0 0 0; height: 24px; background: linear-gradient(transparent, var(--bg)); }
  .card-acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .card-acts button { padding: 4px 10px; font-size: 12px; border-radius: 5px; }
  .badge-status { font-size: 10.5px; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
  .bs-new { background: rgba(122,162,247,.15); color: var(--blue); }
  .bs-drafted { background: rgba(251,191,36,.15); color: var(--amber); }
  .bs-sent { background: rgba(125,140,158,.18); color: var(--muted); }
  .bs-replied { background: rgba(74,222,128,.15); color: var(--green); }
  .bs-converted { background: rgba(74,222,128,.3); color: var(--green); font-weight: 700; }

  /* compact form rows for outreach/content/quick-modals */
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .form-row input, .form-row select, .form-row textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 12.5px; flex: 1; min-width: 100px; }
  .form-row textarea { min-height: 38px; resize: vertical; font-family: var(--mono); font-size: 12px; flex: 2; min-width: 180px; }
  .form-row button { padding: 6px 14px; border-radius: 6px; font-size: 12.5px; cursor: pointer; background: rgba(74,222,128,.12); border: 1px solid var(--green); color: var(--green); flex: 0 0 auto; }
  .form-row button:hover { background: rgba(74,222,128,.25); }

  /* stream activate / ready */
  .stream-card .activate-btn { margin-top: 8px; padding: 5px 12px; font-size: 12px; border-radius: 6px; background: rgba(74,222,128,.12); border: 1px solid var(--green); color: var(--green); cursor: pointer; width: 100%; }
  .stream-card .activate-btn:hover { background: rgba(74,222,128,.25); }
  .stream-card .stream-earnings { font-family: var(--mono); font-size: 12px; color: var(--green); margin-top: 6px; }
  .stream-status.ready { background: rgba(251,146,60,.18); color: #fb923c; }
  .pulse-orange { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #fb923c; margin-right: 5px; vertical-align: middle; animation: pulse 1.5s infinite; }
  .stream-ready-label { font-size: 11px; color: #fb923c; margin-top: 6px; }
  .streams-total { margin-left: auto; color: var(--green); font-family: var(--mono); font-weight: 700; }

  /* timeline (7-day calendar) */
  .timeline { border-left: 2px solid var(--border2); margin: 14px 0 14px 14px; padding-left: 18px; }
  .timeline-item { position: relative; margin-bottom: 14px; }
  .timeline-item::before { content: ''; position: absolute; left: -25px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); border: 2px solid var(--bg); }
  .timeline-day { font-size: 11px; color: var(--blue); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .timeline-body { color: var(--text); font-size: 13px; white-space: pre-wrap; }

  /* quickbar (fixed at bottom) */
  .quickbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel2); border-top: 1px solid var(--border); padding: 10px 20px; display: flex; gap: 10px; justify-content: center; z-index: 100; flex-wrap: wrap; }
  .quickbar button { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer; }
  .quickbar button:hover { border-color: var(--green); }
  body { padding-bottom: 60px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Income Radar <span>— bounty &amp; zlecenia</span></h1>
    <div class="meta">
      <span id="updated">…</span>
      <span id="paidSum" style="color:var(--green);font-weight:600"></span>
      <span id="tgBadge" style="font-size:12px"></span>
      <span id="pipeStats" style="font-size:12px;color:var(--muted)"></span>
      <span title="auto-odswiezanie"><span class="pulse"></span><span id="countdown">1:00</span></span>
      <button id="notifBtn" title="Powiadomienia o nowych pozycjach">🔔 Powiadomienia</button>
      <button id="refreshBtn">Odśwież teraz</button>
    </div>
  </header>

  <div class="hero">
    <div class="stat"><div class="stat-val" id="st-total">0</div><div class="stat-lbl">Pozycji</div></div>
    <div class="stat"><div class="stat-val" id="st-drafts">0</div><div class="stat-lbl">Szkicow</div></div>
    <div class="stat"><div class="stat-val" id="st-sent">0</div><div class="stat-lbl">Wyslanych</div></div>
    <div class="stat clickable" id="st-earn-box" title="Klik = pelne zarobki, ledger, dodawanie">
      <div class="stat-val green" id="st-earnings">$0</div>
      <div class="stat-lbl">Zarobione <span class="trend" id="st-earn-trend"></span></div>
    </div>
    <div class="stat"><div class="stat-val" id="st-winrate">-</div><div class="stat-lbl">Win Rate</div></div>
    <div class="stat"><div class="stat-val" id="st-queue">0</div><div class="stat-lbl">W kolejce</div></div>
    <div class="stat">
      <div class="stat-val" id="st-today">$0</div>
      <div class="stat-lbl">Dzisiaj</div>
      <div class="stat-sub" id="st-period">tydz: $0 · msc: $0</div>
    </div>
  </div>

  <div class="sources" id="source-chips"></div>


  <nav>
    <button data-tab="bounty" class="on">Bounty<span class="cnt" id="cntBounty">–</span></button>
    <button data-tab="useme">Zlecenia<span class="cnt" id="cntUseme">–</span></button>
    <button data-tab="konkursy">Konkursy<span class="cnt" id="cntKonkursy">–</span></button>
    <button data-tab="hotele">Hotele<span class="cnt" id="cntHotele">–</span></button>
    <button data-tab="agent">Agent<span class="cnt" id="cntAgent">–</span></button>
    <button data-tab="kolejka">Kolejka<span class="cnt" id="cntKolejka">–</span></button>
    <button data-tab="strumienie">Strumienie<span class="cnt" id="cntStrumienie">–</span></button>
    <button data-tab="statystyki">Statystyki</button>
    <button data-tab="outreach">Outreach<span class="cnt" id="cntOutreach">–</span></button>
    <button data-tab="content">Content<span class="cnt" id="cntContent">–</span></button>
    <button data-tab="konta">Konta / start</button>
  </nav>

  <div class="filters" id="filters">
    <input type="search" id="q" placeholder="Szukaj w tytułach…">
    <label>min $ <input type="number" id="minAmt" value="0" style="width:70px"></label>
    <label>max konkurencja <input type="number" id="maxComp" value="99" style="width:60px"></label>
    <select id="srcSel">
      <option value="">wszystkie źródła</option>
      <option value="opire">Opire</option>
      <option value="algora">Algora</option>
      <option value="github">GitHub</option>
      <option value="h1bounty">HackerOne</option>
      <option value="airdrop">Airdrop</option>
      <option value="useme">Useme</option>
      <option value="freelancer">Freelancer</option>
      <option value="upwork">Upwork</option>
      <option value="fiverr">Fiverr</option>
    </select>
    <select id="sortSel">
      <option value="score">sortuj: opłacalność</option>
      <option value="amount">sortuj: kwota</option>
      <option value="new">sortuj: najnowsze</option>
    </select>
    <label><input type="checkbox" id="showHidden"> pokaż ukryte</label>
  </div>

  <div id="list"></div>
</div>

<div class="quickbar">
  <button onclick="quickGenContent()">📝 Generuj post</button>
  <button onclick="quickAddLead()">👤 Dodaj lead</button>
  <button onclick="quickAddEarning()">💰 Dodaj zarobek</button>

const $ = id => document.getElementById(id);

const seenKey = 'radar-seen';
const getSeen = () => new Set(JSON.parse(localStorage.getItem(seenKey) || '[]'));
const setSeen = s => localStorage.setItem(seenKey, JSON.stringify([...s].slice(-3000)));

function compOf(it) {
  const c = it.competition || {};
  if (c.offers !== null && c.offers !== undefined) return c.offers;
  if (c.claims === null || c.claims === undefined) return null;
  return c.claims + Math.floor((c.trying || 0) / 2);
}
function ago(ts) {
  if (!ts) return '';
  const d = Math.floor((Date.now() - ts) / 864e5);
  return d <= 0 ? 'dziś' : d === 1 ? 'wczoraj' : `${d} dni temu`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('cntAgent').textContent = `${DB.items.filter(i => (STATE.itemStatus[i.id] || '') === 'agent').length}·${Object.keys(DRAFTS).length}`;
  const paid = Object.values(STATE.ledger || {}).reduce((s, e) => s + (e?.amountUSD || 0), 0);
  $('paidSum').textContent = paid ? `💰 wypłacone: $${paid.toLocaleString('en-US')}` : '';
  $('filters').style.display = ['konta','agent','hotele','kolejka','strumienie','statystyki','outreach','content'].includes(tab) ? 'none' : 'flex';
  $('srcSel').style.display = (tab === 'bounty' || tab === 'useme') ? '' : 'none';
  const list = $('list');
  if (tab === 'konta') return renderAccounts(list);
  if (tab === 'agent') return renderAgent(list);
  if (tab === 'hotele') return renderHotele(list);
  if (tab === 'kolejka') return renderKolejka(list);
  if (tab === 'strumienie') return renderStrumienie(list);
  if (tab === 'statystyki') return renderStatystyki(list);
  if (tab === 'outreach') return renderOutreach(list);
  if (tab === 'content') return renderContent(list);

  const q = $('q').value.toLowerCase();
  const minAmt = Number($('minAmt').value) || 0;
  const maxComp = Number($('maxComp').value) || 99;
  const srcF = $('srcSel').value;
  const showHidden = $('showHidden').checked;
  const seen = getSeen();

  let items = DB.items.filter(it => (TAB_SRC[tab] || []).includes(it.source));
  items = items.filter(it => {
    const st = STATE.itemStatus[it.id] || '';
    if (st === 'ukryte' && !showHidden) return false;
    if (srcF && it.source !== srcF) return false;
    if (q && !it.title.toLowerCase().includes(q) && !(it.org || '').toLowerCase().includes(q)) return false;
    if ((it.amountUSD || 0) < minAmt) return false;
    const c = compOf(it);
    if (c !== null && c > maxComp) return false;
    return true;
  });
  const sort = $('sortSel').value;
  items.sort((a, b) => sort === 'amount' ? (b.amountUSD || 0) - (a.amountUSD || 0)
    : sort === 'new' ? (b.firstSeen || 0) - (a.firstSeen || 0)
    : (b.score || 0) - (a.score || 0));

  if (!items.length) { list.innerHTML = '<div class="empty">Nic nie pasuje do filtrów.</div>'; return; }
  list.innerHTML = items.map(it => rowHtml(it, seen)).join('');
  bindStatus(list);
}

function rowHtml(it, seen) {
  const c = compOf(it);
  const isNew = seen ? !seen.has(it.id) : false;
  const st = STATE.itemStatus[it.id] || '';
  const compTxt = (it.competition && it.competition.offers !== null && it.competition.offers !== undefined)
    ? `ofert: <b>${it.competition.offers}</b>`
    : (c === null ? 'konkurencja: ?' : `claimy: <b>${it.competition.claims}</b> · PRy: <b>${it.competition.trying}</b>`);
  const vLabel = { hot: 'WARTO', ok: 'OK', crowd: 'TŁOK', unknown: '?' }[it.verdict] || '?';
  const langs = (it.langs || []).map(l => `<span class="chip">${esc(l)}</span>`).join('');
  const draftChip = DRAFTS[it.id] ? (DRAFTS[it.id].kind === 'auto' ? '<span class="chip" style="color:#61afef;border-color:#61afef">🤖 AUTO-szkic</span>' : '<span class="chip" style="color:var(--green);border-color:var(--green)">📝 szkic</span>') : '';
  const skillChip = (it.skillMatch || 0) > 0 ? '<span class="chip" style="color:var(--blue);border-color:var(--blue)">✦ pasuje</span>' : '';
  const fup = st === 'wyslane' && STATE.statusTs && STATE.statusTs[it.id] && (Date.now() - STATE.statusTs[it.id] > 3 * 864e5)
    ? '<span class="chip" style="color:#e5a158;border-color:#e5a158">🔔 follow-up</span>' : '';
  const isPln = it.source === 'useme' || it.source === 'freelancer';
  const qactBtn = DRAFTS[it.id] && ['opire','algora','github','h1bounty','airdrop'].includes(it.source)
    ? `<button class="qact" data-copy-comment="${esc(it.id)}" title="Kopiuj komentarz">📋</button>`
    : (DRAFTS[it.id] && ['useme','freelancer','upwork','fiverr'].includes(it.source)
      ? `<button class="qact" data-preview-draft="${esc(it.id)}" title="Podglad szkicu">📝</button>`
      : '');
  return `<div class="row ${isNew ? 'new' : ''}">
    <div class="amt ${isPln ? 'pln' : ''}">${esc(it.amountText)}${isPln && it.amountUSD ? `<small>≈ $${it.amountUSD}</small>` : ''}</div>
    <div class="ttl"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
      <div class="sub"><span class="chip src-${it.source}">${it.source}</span>${it.org ? `<span>${esc(it.org)}</span>` : ''}${langs}${skillChip}${draftChip}${qactBtn}${fup}${ageChip(it)}${it.note ? `<span>${esc(it.note)}</span>` : ''}<span title="kiedy radar to wykrył">${ago(it.firstSeen)}</span></div>
    </div>
    <div class="comp">${compTxt}</div>
    <div class="verdict v-${it.verdict}">${vLabel}</div>
    <div class="stwrap"><select class="status" data-id="${esc(it.id)}">
      ${STATUSES.map(s => `<option value="${s}" ${s === st ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`).join('')}
    </select></div>
  </div>`;
}

// realny wiek bounty/ogloszenia: zielony = swieze (<=7 dni), czerwony = wrak (>180 dni)
function ageChip(it) {
  if (it.ageDays === null || it.ageDays === undefined) return '';
  const style = it.ageDays > 180 ? 'color:#e06c75;border-color:#e06c75' : it.ageDays <= 7 ? 'color:var(--green);border-color:var(--green)' : '';
  const label = it.ageDays === 0 ? 'dziś' : it.ageDays === 1 ? '1 dzień' : `${it.ageDays} dni`;
  const last = it.lastActivityAt ? ` · ostatni ruch: ${new Date(it.lastActivityAt).toLocaleDateString('pl-PL')}` : '';
  return `<span class="chip" style="${style}" title="realny wiek bounty/ogłoszenia${last}">🕒 ${label}</span>`;
}

function bindStatus(list) {
  list.querySelectorAll('select.status').forEach(sel => sel.addEventListener('change', async () => {
    STATE.itemStatus[sel.dataset.id] = sel.value;
    const it = DB.items.find(i => i.id === sel.dataset.id);
    const entry = sel.value === 'wyplacone' && it ? { ts: Date.now(), amountUSD: it.amountUSD || 0, title: it.title } : null;
    if (!STATE.ledger) STATE.ledger = {};
    if (entry) STATE.ledger[sel.dataset.id] = entry; else delete STATE.ledger[sel.dataset.id];
    if (!STATE.statusTs) STATE.statusTs = {};
    STATE.statusTs[sel.dataset.id] = Date.now();
    await fetch('/api/state', { method: 'POST', body: JSON.stringify({ itemStatus: { [sel.dataset.id]: sel.value }, ledger: { [sel.dataset.id]: entry }, statusTs: { [sel.dataset.id]: Date.now() } }) });
    render();
  }));
  list.querySelectorAll('button[data-copy-comment]').forEach(b => b.addEventListener('click', () => copyComment(b.dataset.copyComment)));
  list.querySelectorAll('button[data-preview-draft]').forEach(b => b.addEventListener('click', () => previewDraft(b.dataset.previewDraft)));
}

function renderAgent(list) {
  const queued = DB.items.filter(it => (STATE.itemStatus[it.id] || '') === 'agent');
  const drafts = Object.entries(DRAFTS).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
  const approved = Object.keys(STATE.itemStatus || {}).filter(id => STATE.itemStatus[id] === 'do-wyslania' && id.startsWith('useme:'));
  let html = `<div class="sect">Auto-wysyłka ofert (Useme)</div>
  <div class="draft" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button id="sendQueue" ${approved.length ? '' : 'disabled'} style="${approved.length ? 'color:var(--green);border-color:var(--green)' : ''}">📨 Wyślij zatwierdzone (${approved.length})</button>
    <span style="color:var(--dim);font-size:12.5px">Zatwierdź szkic poniżej → silnik składa ofertę przez Twoją przeglądarkę (min 7 dni, link do demo, prawa autorskie — automatycznie). Wymaga uruchomionego chrome-debug.cmd.</span>
    <span id="sendResult" style="font-size:12.5px"></span>
  </div>`;
  html += `<div class="sect">W kolejce do agenta (${queued.length})</div>`;
  html += queued.length
    ? queued.map(it => rowHtml(it, null)).join('')
    : '<div class="empty">Pusto. Ustaw przy pozycji status „🤖 do agenta”, potem powiedz agentowi: <b>kolejka</b>.</div>';
  html += `<div class="sect">Szkice od agenta (${drafts.length})</div>`;
  html += drafts.length ? drafts.map(([id, d]) => {
    const isUseme = id.startsWith('useme:');
    const st = STATE.itemStatus[id] || '';
    const approveBtn = isUseme
      ? (st === 'do-wyslania'
        ? `<button data-unapprove="${esc(id)}" style="color:var(--green);border-color:var(--green)">✅ zatwierdzone — cofnij</button>`
        : (st === 'wyslane' ? '<span class="chip" style="color:var(--green);border-color:var(--green)">📤 wysłane</span>' : `<button data-approve="${esc(id)}">✅ zatwierdź do wysyłki</button>`))
      : '';
    return `
    <div class="draft">
      <div class="hd">
        <span class="chip" style="${d.kind==='llm-oferta'?'color:#61afef;border-color:#61afef':d.kind==='auto'?'color:var(--dim)':''}">${d.kind==='llm-oferta'?'🤖 LLM szyta':esc(d.kind || 'analiza')}</span>
        <a href="${esc(d.url || '#')}" target="_blank" rel="noopener">${esc(d.title || id)}</a>
        <span style="color:var(--dim);font-size:11.5px;margin-left:auto">${d.ts ? new Date(d.ts).toLocaleString('pl-PL') : ''}</span>
      </div>
      <pre>${esc(d.body || '')}</pre>
      <div class="acts">
        ${approveBtn}
        <button data-copy="${esc(id)}">Kopiuj</button>
        <button data-del="${esc(id)}">Usuń szkic</button>
      </div>
    </div>`; }).join('') : '<div class="empty">Brak szkiców.</div>';
  list.innerHTML = html;
  bindStatus(list);
  const setStatus = async (id, val) => { STATE.itemStatus[id] = val; await fetch('/api/state', { method: 'POST', body: JSON.stringify({ itemStatus: { [id]: val } }) }); render(); };
  list.querySelectorAll('button[data-approve]').forEach(b => b.addEventListener('click', () => setStatus(b.dataset.approve, 'do-wyslania')));
  list.querySelectorAll('button[data-unapprove]').forEach(b => b.addEventListener('click', () => setStatus(b.dataset.unapprove, 'szkic')));
  const sq = $('sendQueue');
  if (sq) sq.addEventListener('click', async () => {
    sq.disabled = true; sq.textContent = '📨 Wysyłam…'; $('sendResult').textContent = '';
    try {
      const r = await (await fetch('/api/offers/send', { method: 'POST', body: JSON.stringify({}) })).json();
      const ok = (r.results || []).filter(x => x.sent).length;
      const fail = (r.results || []).length - ok;
      $('sendResult').innerHTML = `<span style="color:var(--green)">wysłano: ${ok}</span>${fail ? ` · <span style="color:#e06c75">błąd: ${fail}</span>` : ''}`;
      STATE = await (await fetch('/api/state')).json();
    } catch (e) { $('sendResult').textContent = 'błąd połączenia'; }
    setTimeout(() => render(), 1800);
  });
  list.querySelectorAll('button[data-copy]').forEach(b => b.addEventListener('click', async () => {
    await navigator.clipboard.writeText((DRAFTS[b.dataset.copy] || {}).body || '');
    b.textContent = 'Skopiowano ✓'; setTimeout(() => { b.textContent = 'Kopiuj'; }, 1500);
  }));
  list.querySelectorAll('button[data-del]').forEach(b => b.addEventListener('click', async () => {
    await fetch('/api/drafts', { method: 'POST', body: JSON.stringify({ [b.dataset.del]: null }) });
    delete DRAFTS[b.dataset.del];
    render();
  }));
}

function renderAccounts(list) {
  list.innerHTML = ACCOUNTS.map(a => {
    if (a.sect) return `<div class="sect">${a.sect}</div>`;
    const done = !!STATE.accounts[a.id];
    return `<div class="acc ${done ? 'done' : ''}">
      <input type="checkbox" data-acc="${a.id}" ${done ? 'checked' : ''}>
      <div><div class="nm"><a href="${a.url}" target="_blank" rel="noopener">${a.name}</a></div><p>${a.desc}</p></div>
    </div>`;
  }).join('');
  list.querySelectorAll('input[data-acc]').forEach(cb => cb.addEventListener('change', async () => {
    STATE.accounts[cb.dataset.acc] = cb.checked;
    await fetch('/api/state', { method: 'POST', body: JSON.stringify({ accounts: { [cb.dataset.acc]: cb.checked } }) });
    render();
  }));
}

function notifyNew(items) {
  if (Notification.permission !== 'granted') return;
  const seen = getSeen();
  const fresh = items.filter(it => !seen.has(it.id) && (it.verdict === 'hot' || (it.verdict === 'ok' && (it.amountUSD || 0) >= 100)));
  for (const it of fresh.slice(0, 3)) {
    new Notification(`${it.amountText} — ${it.source}`, { body: it.title });
  }
}

  try { const sr = await fetch('/api/stats'); STATS = sr.ok ? await sr.json() : {}; } catch { STATS = {}; }
  try { const qr = await fetch('/api/queue'); const qd = qr.ok ? await qr.json() : []; QUEUE = Array.isArray(qd) ? qd : (qd && Array.isArray(qd.items) ? qd.items : []); } catch { QUEUE = []; }
  try { const wrr = await fetch('/api/winrates'); WINRATES = wrr.ok ? await wrr.json() : {}; } catch { WINRATES = {}; }
  // new endpoints — graceful 404/network fallback keeps last known state
  try { const er = await fetch('/api/earnings'); if (er.ok) EARNINGS = await er.json() || EARNINGS; } catch {}
  try { const or = await fetch('/api/outreach'); if (or.ok) OUTREACH = await or.json() || OUTREACH; } catch {}

  $('tgBadge').textContent = DB.tg ? '🔔 Telegram ON' : '🔕 Telegram OFF';

  $('tgBadge').title = DB.tg ? 'Alerty Telegram aktywne' : 'Wpisz telegramToken i telegramChatId w config.json (BotFather → /newbot) — alerty o świeżych okazjach bez otwartej przeglądarki';

  const stVals = Object.values(STATE.itemStatus || {});
  const sent = stVals.filter(s => ['wyslane', 'odpowiedz', 'wygrane', 'przegrane', 'wyplacone'].includes(s)).length;
  const resp = stVals.filter(s => ['odpowiedz', 'wygrane', 'przegrane', 'wyplacone'].includes(s)).length;

  $('pipeStats').textContent = sent ? `📤 ${sent} · 💬 ${resp} · 🏆 ${won} (${Math.round(100 * won / sent)}%)` : '';
  $('pipeStats').title = 'pipeline: wysłane · odpowiedzi · wygrane (skuteczność)';
  $('cntKolejka').textContent = QUEUE.length || '–';
  $('cntStrumienie').textContent = STREAMS.filter(s => streamStatus(s) === 'active').length;
  const oc = $('cntOutreach'); if (oc) oc.textContent = (OUTREACH.leads || []).length || '–';
  const cc = $('cntContent'); if (cc) cc.textContent = (CONTENT.posts || []).length || '–';
  updateHero();

function updateHero() {
  const totalItems = (DB.items || []).length;
  const draftCount = Object.keys(DRAFTS || {}).length;
  const stVals = Object.values(STATE.itemStatus || {});
  const sentCount = stVals.filter(s => ['wyslane', 'odpowiedz', 'wygrane', 'przegrane', 'wyplacone'].includes(s)).length;
  const ledgerSum = Object.values(STATE.ledger || {}).reduce((s, e) => s + (e?.amountUSD || 0), 0);
  const earningsTotal = (EARNINGS && +EARNINGS.total) || ledgerSum;
  const won = stVals.filter(s => ['wygrane', 'wyplacone'].includes(s)).length;
  const wrPct = (WINRATES && WINRATES.total && WINRATES.total.winRate !== undefined && WINRATES.total.winRate !== null)
    ? `${Math.round(WINRATES.total.winRate)}%`
    : (sentCount ? `${Math.round(100 * won / sentCount)}%` : '-');
  const queueReady = (STATS && STATS.queueReady !== undefined) ? STATS.queueReady : (QUEUE.length || 0);
  const today = (EARNINGS && EARNINGS.today !== undefined) ? +EARNINGS.today : (+STATS.todayEarnings || 0);
  const week  = (EARNINGS && EARNINGS.week  !== undefined) ? +EARNINGS.week  : (+STATS.weekEarnings  || 0);
  const month = (EARNINGS && EARNINGS.month !== undefined) ? +EARNINGS.month : 0;
  $('st-total').textContent    = totalItems.toLocaleString('en-US');
  $('st-drafts').textContent   = draftCount;
  $('st-sent').textContent     = sentCount;
  $('st-earnings').textContent = `$${(+earningsTotal || 0).toLocaleString('en-US')}`;
  $('st-winrate').textContent  = wrPct;
  $('st-queue').textContent    = queueReady;
  $('st-today').textContent    = `$${(+today || 0).toLocaleString('en-US')}`;
  const periodEl = $('st-period');
  if (periodEl) periodEl.textContent = `tydz: $${(+week || 0).toLocaleString('en-US')} · msc: $${(+month || 0).toLocaleString('en-US')}`;
  // trend: today vs 7-day avg, or use server-side EARNINGS.trend (pct)
  const trendEl = $('st-earn-trend');
  if (trendEl) {
    let trendPct = null;
    if (EARNINGS && typeof EARNINGS.trend === 'number' && EARNINGS.trend !== 0) {
      trendPct = Math.round(EARNINGS.trend);
    } else if (week > 0 && today > 0) {
      const avgDaily = week / 7;
      if (avgDaily > 0) trendPct = Math.round(((today - avgDaily) / avgDaily) * 100);
    }
    if (trendPct !== null) {
      const up = trendPct >= 0;
      trendEl.textContent = `${up ? '▲' : '▼'} ${Math.abs(trendPct)}%`;
      trendEl.className = `trend ${up ? 'up' : 'down'}`;
    } else {
      trendEl.textContent = '';
      trendEl.className = 'trend';
    }
  }
  // wire click handler exactly once
  const earnBox = $('st-earn-box');
  if (earnBox && !earnBox.dataset.wired) {
    earnBox.addEventListener('click', openEarningsModal);
    earnBox.dataset.wired = '1';
  }
}

function updateSourceChips() {

async function previewDraft(id) {
  try { const r = await fetch('/api/drafts'); if (r.ok) DRAFTS = await r.json() || DRAFTS; } catch {}
  const d = DRAFTS[id];
  if (!d) { flashToast('Brak szkicu dla tej pozycji', true); return; }
  const it = (DB.items || []).find(i => i.id === id) || {};
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">
    <h3>${esc(it.title || d.title || id)}</h3>
    <div style="color:var(--muted);font-size:12px;margin-bottom:10px">
      <span class="chip src-${esc(it.source || 'item')}">${esc(it.source || 'item')}</span>

    </div>
    <textarea id="modalTxt">${esc(d.body || '')}</textarea>
    <div class="acts">
      <button id="modalCopy" class="btn-approve">📋 Kopiuj</button>
      <button id="modalSave">💾 Zapisz zmiany</button>
      <button id="modalClose">Zamknij</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  bg.querySelector('#modalClose').addEventListener('click', close);
  bg.querySelector('#modalCopy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(bg.querySelector('#modalTxt').value); flashToast('Skopiowano ✓'); }
    catch { flashToast('Blad kopiowania', true); }
  });
  bg.querySelector('#modalSave').addEventListener('click', async () => {
    const body = bg.querySelector('#modalTxt').value;
    DRAFTS[id] = { ...d, body, ts: Date.now() };
    try { await fetch('/api/drafts', { method: 'POST', body: JSON.stringify({ [id]: DRAFTS[id] }) }); flashToast('Zapisano ✓'); }
    catch { flashToast('Blad zapisu', true); }
    close();
    render();
  });
}

function flashToast(msg, err) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.borderColor = err ? 'var(--red)' : 'var(--green)';
  t.style.color = err ? 'var(--red)' : 'var(--green)';
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = '0'; }, 1800);
}

function tickCountdown() {
  const el = $('countdown'); if (!el) return;
  if (countdownLeft <= 0) {
    countdownLeft = (STATS.refreshMinutes || 1) * 60;
    el.textContent = '...';
    load();
    return;
  }
  const m = Math.floor(countdownLeft / 60);
  const s = countdownLeft % 60;
  el.textContent = `${m}:${String(s).padStart(2, '0')}`;
  countdownLeft--;
}


// =============== STREAM HELPERS ===============
function streamSlug(name) {
  return String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}
function streamMidpoint(range) {
  // parse "$2000-6000/msc" or "$500-10000/find" -> midpoint in USD
  const m = String(range).match(/\$?(\d[\d ,]*)\s*[-–]\s*\$?(\d[\d ,]*)/);
  if (!m) return 0;
  const a = +m[1].replace(/[ ,]/g, '');
  const b = +m[2].replace(/[ ,]/g, '');
  return Math.round((a + b) / 2);
}
function streamStatus(s) {
  const slug = streamSlug(s.name);
  const apiItems = STREAMS_API && Array.isArray(STREAMS_API.items) ? STREAMS_API.items : [];
  const hit = apiItems.find(x => streamSlug(x.id || x.name || '') === slug);
  return (hit && hit.status) || s.status;
}
function streamEarnings(s) {
  if (!EARNINGS || !EARNINGS.streams) return 0;
  const slug = streamSlug(s.name);
  const v = EARNINGS.streams[slug] !== undefined ? EARNINGS.streams[slug] : EARNINGS.streams[s.name];
  return +v || 0;
}

    const amount = +ov.querySelector('#er-amt').value;
    const source = ov.querySelector('#er-src').value;
    const note   = ov.querySelector('#er-note').value.trim();
    if (!amount) { flashToast('Wpisz kwote', true); return; }
    const btn = ov.querySelector('#er-add'); btn.disabled = true; btn.textContent = 'Dodaje...';
    try {
      const r = await fetch('/api/earnings/add', { method: 'POST', body: JSON.stringify({ amountUSD: amount, source, note, ts: Date.now() }) });
      if (!r.ok) throw new Error(r.status);
      flashToast(`+$${amount} ✓`);
      close();
      await load();
    } catch {
      btn.disabled = false; btn.textContent = '+ Dodaj';
      flashToast('Endpoint /api/earnings/add nieaktywny', true);
    }
  });
}

// =============== QUICK ACTIONS (bottom bar) ===============
function openMiniModal(title, formHtml, onSubmit) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal" style="max-width:480px">
    <span class="modal-close">×</span>
    <h2>${esc(title)}</h2>
    ${formHtml}
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button class="mm-cancel" style="padding:8px 14px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer">Anuluj</button>
      <button class="mm-ok" style="padding:8px 14px;border-radius:6px;border:1px solid var(--green);background:rgba(74,222,128,.15);color:var(--green);cursor:pointer">OK</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.querySelector('.modal-close').addEventListener('click', close);
  ov.querySelector('.mm-cancel').addEventListener('click', close);
  ov.querySelector('.mm-ok').addEventListener('click', async () => {
    const ok = await onSubmit(ov);
    if (ok !== false) close();
  });
  return ov;
}
