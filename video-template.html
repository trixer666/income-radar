<!DOCTYPE html>
<html><head><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; overflow:hidden; font-family:'Inter',system-ui; color:#fff; background:#07070f; }

/* Animated gradient BG */
.bg { position:absolute; inset:0; background: radial-gradient(ellipse at 50% 0%, #0d1b3e 0%, #07070f 60%); }
.bg::after { content:''; position:absolute; inset:0; background: radial-gradient(ellipse at 30% 90%, rgba(0,212,255,.06) 0%, transparent 50%); }

/* Grid lines */
.grid { position:absolute; inset:0; opacity:.04;
  background-image: linear-gradient(rgba(255,255,255,.3) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.3) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* Floating particles */
.particle { position:absolute; border-radius:50%; animation: float linear infinite; opacity:0; }
@keyframes float { 0%{transform:translateY(1920px);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-100px);opacity:0} }

/* Glow orbs */
.orb1 { position:absolute; width:400px; height:400px; border-radius:50%; top:-100px; right:-100px; background:radial-gradient(circle, rgba(0,212,255,.15), transparent 70%); animation: pulse 4s ease-in-out infinite; }
.orb2 { position:absolute; width:300px; height:300px; border-radius:50%; bottom:200px; left:-80px; background:radial-gradient(circle, rgba(139,92,246,.12), transparent 70%); animation: pulse 5s ease-in-out infinite reverse; }
@keyframes pulse { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.2);opacity:1} }

/* Top bar */
.topbar { position:relative; padding:60px 50px 30px; display:flex; justify-content:space-between; align-items:center; }
.logo { font-size:22px; font-weight:700; letter-spacing:1px; color:rgba(255,255,255,.5); }
.live { display:flex; align-items:center; gap:8px; font-size:18px; color:#4ade80; font-weight:600; }
.live-dot { width:10px; height:10px; border-radius:50%; background:#4ade80; animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* Direction badge */
.direction { text-align:center; margin:40px 0 20px; }
.dir-badge { display:inline-flex; align-items:center; gap:16px; padding:16px 44px; border-radius:60px; font-size:44px; font-weight:900; letter-spacing:4px; }
.dir-badge.long { background:linear-gradient(135deg, rgba(74,222,128,.2), rgba(74,222,128,.05)); border:2px solid rgba(74,222,128,.4); color:#4ade80; }
.dir-badge.short { background:linear-gradient(135deg, rgba(248,113,113,.2), rgba(248,113,113,.05)); border:2px solid rgba(248,113,113,.4); color:#f87171; }
.dir-arrow { font-size:52px; }

/* Pair */
.pair { text-align:center; font-size:72px; font-weight:900; letter-spacing:3px; margin:10px 0 50px; text-shadow: 0 0 40px rgba(255,255,255,.15); }

/* Signal card */
.card { margin:0 50px; background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.08); border-radius:24px; padding:40px; backdrop-filter:blur(10px); }
.card-row { display:flex; justify-content:space-between; align-items:center; padding:18px 0; border-bottom:1px solid rgba(255,255,255,.06); }
.card-row:last-child { border-bottom:none; }
.card-label { font-size:24px; color:rgba(255,255,255,.45); font-weight:600; display:flex; align-items:center; gap:12px; }
.card-label .icon { font-size:28px; }
.card-value { font-size:32px; font-weight:700; font-family:'JetBrains Mono',monospace; }
.card-value.green { color:#4ade80; }
.card-value.red { color:#f87171; }
.card-value.blue { color:#60a5fa; }
.card-value.yellow { color:#fbbf24; }

/* Risk/Reward bar */
.rr-section { margin:40px 50px 0; }
.rr-label { font-size:20px; color:rgba(255,255,255,.35); margin-bottom:12px; font-weight:600; }
.rr-bar { height:8px; border-radius:4px; background:rgba(255,255,255,.06); overflow:hidden; display:flex; }
.rr-risk { background:linear-gradient(90deg, #f87171, #ef4444); border-radius:4px 0 0 4px; }
.rr-reward { background:linear-gradient(90deg, #4ade80, #22c55e); border-radius:0 4px 4px 0; }
.rr-values { display:flex; justify-content:space-between; margin-top:8px; font-size:16px; color:rgba(255,255,255,.3); }

/* Source line */
.source { text-align:center; margin:40px 0 20px; font-size:18px; color:rgba(255,255,255,.2); }

/* CTA */
.cta { margin:20px 50px; text-align:center; padding:28px; background:linear-gradient(135deg, rgba(0,180,255,.12), rgba(139,92,246,.08)); border:1px solid rgba(0,180,255,.2); border-radius:20px; }
.cta-text { font-size:28px; font-weight:700; color:#60a5fa; }
.cta-bot { font-size:22px; color:rgba(255,255,255,.5); margin-top:8px; font-family:'JetBrains Mono',monospace; }

/* Bottom bar */
.bottom { position:absolute; bottom:50px; left:0; right:0; text-align:center; }
.bottom-brand { font-size:18px; font-weight:600; color:rgba(255,255,255,.15); letter-spacing:4px; text-transform:uppercase; }

/* Animations */
.fade-in { animation: fadeIn .8s ease-out forwards; opacity:0; }
@keyframes fadeIn { to{opacity:1} }
.slide-up { animation: slideUp .6s ease-out forwards; opacity:0; transform:translateY(30px); }
@keyframes slideUp { to{opacity:1;transform:translateY(0)} }
</style></head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="orb1"></div>
<div class="orb2"></div>

<!-- Particles -->
<script>
for(let i=0;i<20;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.style.cssText=`left:${Math.random()*1080}px;width:${2+Math.random()*3}px;height:${2+Math.random()*3}px;background:rgba(${Math.random()>0.5?'74,222,128':'96,165,250'},${0.3+Math.random()*0.4});animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*8}s;`;
  document.body.appendChild(p);
}
</script>

<div class="topbar fade-in">
  <div class="logo">CRYPTO SIGNAL HUB</div>
  <div class="live"><div class="live-dot"></div>LIVE SIGNAL</div>
</div>

<div class="direction slide-up" style="animation-delay:.2s">
  <div class="dir-badge DIRECTION_CLASS" id="dirBadge">
    <span class="dir-arrow" id="dirArrow">ARROW</span>
    <span id="dirText">DIRECTION</span>
  </div>
</div>

<div class="pair slide-up" style="animation-delay:.4s" id="pairText">PAIR</div>

<div class="card slide-up" style="animation-delay:.6s">
  <div class="card-row">
    <div class="card-label"><span class="icon">📍</span>Entry</div>
    <div class="card-value" id="entryVal">$ENTRY</div>
  </div>
  <div class="card-row" id="tp1Row">
    <div class="card-label"><span class="icon">🎯</span>Target 1</div>
    <div class="card-value green" id="tp1Val">$TP1</div>
  </div>
  <div class="card-row" id="tp2Row" style="display:none">
    <div class="card-label"><span class="icon">🎯</span>Target 2</div>
    <div class="card-value green" id="tp2Val">$TP2</div>
  </div>
  <div class="card-row" id="tp3Row" style="display:none">
    <div class="card-label"><span class="icon">🎯</span>Target 3</div>
    <div class="card-value green" id="tp3Val">$TP3</div>
  </div>
  <div class="card-row" id="slRow">
    <div class="card-label"><span class="icon">🛑</span>Stop Loss</div>
    <div class="card-value red" id="slVal">$SL</div>
  </div>
  <div class="card-row" id="levRow" style="display:none">
    <div class="card-label"><span class="icon">⚡</span>Leverage</div>
    <div class="card-value yellow" id="levVal">LEVx</div>
  </div>
  <div class="card-row" id="rrRow" style="display:none">
    <div class="card-label"><span class="icon">📊</span>Risk/Reward</div>
    <div class="card-value blue" id="rrVal">1:RR</div>
  </div>
</div>

<div class="rr-section slide-up" style="animation-delay:.8s" id="rrBar">
  <div class="rr-label">RISK / REWARD</div>
  <div class="rr-bar">
    <div class="rr-risk" id="rrRiskBar" style="width:30%"></div>
    <div class="rr-reward" id="rrRewardBar" style="width:70%"></div>
  </div>
  <div class="rr-values"><span>Risk</span><span>Reward</span></div>
</div>

<div class="source slide-up" style="animation-delay:1s" id="sourceText">Aggregated from 15 channels</div>

<div class="cta slide-up" style="animation-delay:1.2s">
  <div class="cta-text">📊 More signals daily</div>
  <div class="cta-bot">t.me/cshub_signals_bot</div>
</div>

<div class="bottom fade-in" style="animation-delay:1.5s">
  <div class="bottom-brand">Crypto Signal Hub</div>
</div>

<script>
// Inject signal data from URL params or window.SIGNAL
const params = new URLSearchParams(location.search);
const signal = {
  direction: params.get('d') || 'LONG',
  pair: params.get('p') || 'BTC/USDT',
  entry: params.get('e') || '105000',
  tp1: params.get('t1') || '',
  tp2: params.get('t2') || '',
  tp3: params.get('t3') || '',
  sl: params.get('sl') || '',
  lev: params.get('lev') || '',
  source: params.get('src') || 'aggregated',
};

const isLong = signal.direction === 'LONG';
document.getElementById('dirBadge').className = 'dir-badge ' + (isLong ? 'long' : 'short');
document.getElementById('dirArrow').textContent = isLong ? '▲' : '▼';
document.getElementById('dirText').textContent = signal.direction;
document.getElementById('pairText').textContent = signal.pair;
document.getElementById('entryVal').textContent = '$' + Number(signal.entry).toLocaleString('en-US');
if(signal.tp1){document.getElementById('tp1Row').style.display='';document.getElementById('tp1Val').textContent='$'+Number(signal.tp1).toLocaleString('en-US');}else{document.getElementById('tp1Row').style.display='none';}
if(signal.tp2){document.getElementById('tp2Row').style.display='';document.getElementById('tp2Val').textContent='$'+Number(signal.tp2).toLocaleString('en-US');}
if(signal.tp3){document.getElementById('tp3Row').style.display='';document.getElementById('tp3Val').textContent='$'+Number(signal.tp3).toLocaleString('en-US');}
if(signal.sl){document.getElementById('slRow').style.display='';document.getElementById('slVal').textContent='$'+Number(signal.sl).toLocaleString('en-US');}else{document.getElementById('slRow').style.display='none';}
if(signal.lev){document.getElementById('levRow').style.display='';document.getElementById('levVal').textContent=signal.lev+'x';}

// R:R calculation
if(signal.entry && signal.tp1 && signal.sl){
  const e=Number(signal.entry), t=Number(signal.tp1), s=Number(signal.sl);
  const risk = Math.abs(e - s);
  const reward = Math.abs(t - e);
  const rr = risk > 0 ? (reward/risk).toFixed(1) : '?';
  document.getElementById('rrRow').style.display = '';
  document.getElementById('rrVal').textContent = '1:' + rr;
  const riskPct = Math.round(risk/(risk+reward)*100);
  document.getElementById('rrRiskBar').style.width = riskPct+'%';
  document.getElementById('rrRewardBar').style.width = (100-riskPct)+'%';
}else{document.getElementById('rrBar').style.display='none';}

document.getElementById('sourceText').textContent = 'Source: ' + signal.source + ' · Aggregated from 15 channels';
</script>
</body></html>
